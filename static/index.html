<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Negativacao Mailgun / SendGrid -> Snov.io</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --accent: #4f8cff;
    --ok: #3ecf8e;
    --warn: #f2b84b;
    --err: #f2545b;
    /* Categorical (dataviz skill, dark-mode slots 1/2/3 - validated pair + all-pairs) */
    --series-1: #3987e5; /* bounces / sendgrid inativos */
    --series-2: #d95926; /* complaints */
    --series-3: #199e70; /* unsubscribes */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }

  nav.tabs {
    display: flex;
    gap: 4px;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  nav.tabs .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    padding: 12px 4px;
    margin-right: 24px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.tabs .tab-btn:hover { color: var(--text); }
  nav.tabs .tab-btn.active {
    color: var(--text);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .trend-section {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
  }
  .trend-section h2 { margin: 0; }
  .trend-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .trend-header-actions { display: flex; align-items: center; gap: 12px; }
  .todos-check {
    font-size: 12px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
  }
  .run-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .run-btn:hover { filter: brightness(1.1); }
  .run-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; filter: none; }
  .trend-chart-wrap { overflow-x: auto; padding-bottom: 4px; }
  .trend-chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 140px;
    min-width: min-content;
  }
  .trend-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    width: 34px;
    flex: none;
    cursor: default;
  }
  .trend-col .bar-value {
    font-size: 11px;
    color: var(--text-secondary, var(--text));
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .trend-col .bar {
    width: 22px;
    background: var(--series-1);
    border-radius: 4px 4px 0 0;
    min-height: 2px;
  }
  .trend-col .bar-label {
    font-size: 10px;
    color: var(--muted);
    margin-top: 6px;
    white-space: nowrap;
  }
  .trend-col:hover .bar { outline: 2px solid var(--text); outline-offset: 1px; }

  main { display: grid; grid-template-columns: 420px 1fr; gap: 0; min-height: calc(100vh - 65px); }
  .runs-panel { border-right: 1px solid var(--border); overflow-y: auto; }
  .run-row {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
  }
  .run-row:hover { background: var(--panel); }
  .run-row.active { background: var(--panel); border-left: 3px solid var(--accent); }
  .run-row .top { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .run-row .id { font-weight: 600; }
  .run-row .muted { color: var(--muted); font-size: 12px; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.completed { background: rgba(62,207,142,0.15); color: var(--ok); }
  .badge.running { background: rgba(79,140,255,0.15); color: var(--accent); }
  .badge.failed { background: rgba(242,84,91,0.15); color: var(--err); }
  .detail { padding: 24px 32px; overflow-y: auto; }
  .stat-grid { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    min-width: 140px;
  }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 28px; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  tr:hover td { background: var(--panel); }
  h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 12px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .err-text { color: var(--err); }

  /* Bar chart (grupo x series) */
  .chart-legend { display: flex; gap: 18px; margin-bottom: 14px; font-size: 12px; color: var(--muted); }
  .chart-legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .swatch { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
  .chart-rows { margin-bottom: 28px; }
  .chart-row { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
  .chart-row .label {
    width: 220px;
    flex: none;
    font-size: 12px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chart-row .track {
    flex: 1 1 auto;
    display: flex;
    height: 18px;
    background: transparent;
    border-radius: 4px;
    overflow: hidden;
  }
  .chart-seg {
    height: 100%;
    min-width: 2px;
    border-right: 2px solid var(--bg);
    cursor: default;
  }
  .chart-seg:last-child { border-right: none; border-radius: 0 4px 4px 0; }
  .chart-row .total {
    width: 46px;
    flex: none;
    font-size: 12px;
    font-weight: 600;
    text-align: right;
  }

  #chart-tooltip {
    position: fixed;
    display: none;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    pointer-events: none;
    z-index: 50;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  #chart-tooltip .tt-value { font-weight: 700; font-size: 13px; }
  #chart-tooltip .tt-label { color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<header>
  <h1>Negativacao &rarr; Snov.io</h1>
  <div class="sub" id="last-refresh"></div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="mailgun">Mailgun</button>
  <button class="tab-btn" data-tab="sendgrid">SendGrid</button>
</nav>

<section class="tab-panel active" id="tab-mailgun">
  <section class="trend-section">
    <div class="trend-header">
      <h2>E-mails unicos por execucao (historico)</h2>
      <button class="run-btn" id="run-btn-mailgun">Rodar agora</button>
    </div>
    <div class="trend-chart-wrap">
      <div class="trend-chart" id="trend-chart-mailgun"><div class="empty">Carregando...</div></div>
    </div>
  </section>
  <main>
    <div class="runs-panel" id="runs-panel-mailgun">
      <div class="empty">Carregando...</div>
    </div>
    <div class="detail" id="detail-panel-mailgun">
      <div class="empty">Selecione uma execucao a esquerda.</div>
    </div>
  </main>
</section>

<section class="tab-panel" id="tab-sendgrid">
  <section class="trend-section">
    <div class="trend-header">
      <h2>E-mails unicos por execucao (historico)</h2>
      <div class="trend-header-actions">
        <label class="todos-check"><input type="checkbox" id="todos-check-sendgrid"> todo o historico (--todos)</label>
        <button class="run-btn" id="run-btn-sendgrid">Rodar agora</button>
      </div>
    </div>
    <div class="trend-chart-wrap">
      <div class="trend-chart" id="trend-chart-sendgrid"><div class="empty">Carregando...</div></div>
    </div>
  </section>
  <main>
    <div class="runs-panel" id="runs-panel-sendgrid">
      <div class="empty">Carregando...</div>
    </div>
    <div class="detail" id="detail-panel-sendgrid">
      <div class="empty">Selecione uma execucao a esquerda.</div>
    </div>
  </main>
</section>

<div id="chart-tooltip"></div>

<script>
const tooltip = document.getElementById('chart-tooltip');
const lastRefresh = document.getElementById('last-refresh');

// ---- Tabs ----
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

function fmtDate(s) {
  if (!s) return '-';
  return s.replace('T', ' ').replace('Z', '') + ' UTC';
}

function fmtDateShort(s) {
  if (!s) return '-';
  const d = new Date(s.replace(' ', 'T') + 'Z');
  if (isNaN(d)) return s.slice(5, 10);
  return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
}

function badge(status) {
  const span = document.createElement('span');
  span.className = 'badge ' + status;
  span.textContent = status;
  return span.outerHTML;
}

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'className') node.className = v;
    else if (k === 'textContent') node.textContent = v;
    else if (k.startsWith('data-')) node.setAttribute(k, v);
    else node[k] = v;
  }
  for (const child of children) node.appendChild(child);
  return node;
}

function showTooltip(x, y, label, value) {
  tooltip.innerHTML = '';
  const valueEl = document.createElement('div');
  valueEl.className = 'tt-value';
  valueEl.textContent = value;
  const labelEl = document.createElement('div');
  labelEl.className = 'tt-label';
  labelEl.textContent = label;
  tooltip.appendChild(valueEl);
  tooltip.appendChild(labelEl);
  tooltip.style.display = 'block';
  tooltip.style.left = (x + 14) + 'px';
  tooltip.style.top = (y + 14) + 'px';
}

function hideTooltip() {
  tooltip.style.display = 'none';
}

// ==========================================================================
// Dashboard generico: uma instancia por fonte (Mailgun / SendGrid), cada uma
// com seu proprio endpoint, agrupamento de breakdown (dominio x tipo, ou
// data x contagem) e linha de resumo na lista de runs.
// ==========================================================================
function createDashboard(cfg) {
  const trendChart = document.getElementById('trend-chart-' + cfg.prefix);
  const runsPanel = document.getElementById('runs-panel-' + cfg.prefix);
  const detailPanel = document.getElementById('detail-panel-' + cfg.prefix);
  const runBtn = document.getElementById('run-btn-' + cfg.prefix);
  let selectedRunId = null;

  async function triggerRun() {
    const todosCheck = document.getElementById('todos-check-' + cfg.prefix);
    const todos = todosCheck ? todosCheck.checked : false;
    if (!confirm(cfg.confirmMessage(todos))) return;

    runBtn.disabled = true;
    runBtn.textContent = 'Rodando...';
    try {
      const res = await fetch(cfg.triggerUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cfg.triggerBody ? cfg.triggerBody(todos) : {}),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert('Nao foi possivel iniciar: ' + (err.detail || res.status));
        runBtn.disabled = false;
        runBtn.textContent = 'Rodar agora';
        return;
      }
    } catch (e) {
      alert('Nao foi possivel iniciar: ' + e);
      runBtn.disabled = false;
      runBtn.textContent = 'Rodar agora';
      return;
    }
    loadRuns();
  }

  runBtn.addEventListener('click', triggerRun);

  function renderTrendChart(runs) {
    if (!runs.length) {
      trendChart.innerHTML = '<div class="empty">Sem execucoes ainda.</div>';
      return;
    }
    const ordered = [...runs].reverse(); // mais antigo primeiro
    const max = Math.max(1, ...ordered.map(r => r.total_emails || 0));

    trendChart.innerHTML = '';
    ordered.forEach(r => {
      const heightPct = Math.max(2, Math.round(((r.total_emails || 0) / max) * 100));
      const bar = el('div', { className: 'bar' });
      bar.style.height = heightPct + '%';

      const col = el('div', { className: 'trend-col' }, [
        el('div', { className: 'bar-value', textContent: String(r.total_emails ?? '-') }),
        bar,
        el('div', { className: 'bar-label', textContent: '#' + r.id + ' ' + fmtDateShort(r.started_at) }),
      ]);

      col.addEventListener('pointermove', (e) => {
        showTooltip(e.clientX, e.clientY, 'Run #' + r.id + ' - ' + fmtDate(r.started_at), (r.total_emails ?? '-') + ' e-mails');
      });
      col.addEventListener('pointerleave', hideTooltip);

      trendChart.appendChild(col);
    });
  }

  async function loadRuns() {
    const res = await fetch(cfg.apiBase + '?limit=100');
    const runs = await res.json();
    lastRefresh.textContent = 'Atualizado ' + new Date().toLocaleTimeString('pt-BR');

    renderTrendChart(runs);

    const running = runs.some(r => r.status === 'running');
    runBtn.disabled = running;
    runBtn.textContent = running ? 'Rodando...' : 'Rodar agora';

    if (runs.length === 0) {
      runsPanel.innerHTML = '<div class="empty">Nenhuma execucao ainda.</div>';
      return;
    }

    runsPanel.innerHTML = '';
    runs.forEach(r => {
      const row = el('div', {
        className: 'run-row' + (r.id === selectedRunId ? ' active' : ''),
        'data-id': r.id,
      }, [
        el('div', { className: 'top' }, [
          el('span', { className: 'id', textContent: 'Run #' + r.id + (r.dry_run ? ' (dry-run)' : '') }),
        ]),
        el('div', { className: 'muted', textContent: fmtDate(r.started_at) }),
        el('div', { className: 'muted', textContent: cfg.runSummaryLine(r) }),
      ]);
      row.querySelector('.top').insertAdjacentHTML('beforeend', badge(r.status));
      row.addEventListener('click', () => {
        selectedRunId = r.id;
        loadRuns();
        loadDetail(selectedRunId);
      });
      runsPanel.appendChild(row);
    });

    if (selectedRunId === null && runs.length > 0) {
      selectedRunId = runs[0].id;
      loadRuns();
      loadDetail(selectedRunId);
    }
  }

  // ---- Bar chart generico: linhas agrupadas (dominio ou data), empilhado por serie ----
  function renderBreakdownChart(rows) {
    const wrap = el('div');
    const legend = el('div', { className: 'chart-legend' });
    cfg.series.forEach(s => {
      const swatch = el('span', { className: 'swatch' });
      swatch.style.background = s.color;
      const key = el('span', { className: 'key' }, [swatch, el('span', { textContent: s.label })]);
      legend.appendChild(key);
    });
    wrap.appendChild(legend);

    const rowsWrap = el('div', { className: 'chart-rows' });
    const top = rows.slice(0, 15);
    const max = Math.max(1, ...top.map(r => r.total));

    top.forEach(r => {
      const track = el('div', { className: 'track' });
      cfg.series.forEach(s => {
        const count = r.counts[s.key] || 0;
        if (count <= 0) return;
        const seg = el('div', { className: 'chart-seg' });
        seg.style.background = s.color;
        seg.style.width = ((count / max) * 100) + '%';
        seg.addEventListener('pointermove', (e) => {
          showTooltip(e.clientX, e.clientY, r.label + ' - ' + s.label, String(count));
        });
        seg.addEventListener('pointerleave', hideTooltip);
        track.appendChild(seg);
      });

      const row = el('div', { className: 'chart-row' }, [
        el('div', { className: 'label', textContent: r.label, title: r.label }),
        track,
        el('div', { className: 'total', textContent: String(r.total) }),
      ]);
      rowsWrap.appendChild(row);
    });
    wrap.appendChild(rowsWrap);
    return wrap;
  }

  async function loadDetail(runId) {
    const res = await fetch(`${cfg.apiBase}/${runId}`);
    if (!res.ok) {
      detailPanel.innerHTML = '<div class="empty">Execucao nao encontrada.</div>';
      return;
    }
    const run = await res.json();

    const breakdownRows = cfg.buildBreakdownRows(run);

    const totalAdded = run.account_results.reduce((s, a) => s + (a.added || 0), 0);
    const totalFailed = run.account_results.reduce((s, a) => s + (a.failed || 0), 0);
    const totalDup = run.account_results.reduce((s, a) => s + (a.duplicates || 0), 0);

    detailPanel.innerHTML = '';

    const statGrid = el('div', { className: 'stat-grid' });
    [
      [badge(run.status), 'status', true],
      ...cfg.extraStats(run),
      [run.total_emails ?? '-', 'e-mails unicos'],
      [totalAdded, 'enviados Snov.io'],
      [totalDup, 'duplicados'],
      [totalFailed, 'falharam'],
    ].forEach(([n, l, isHtml]) => {
      const nEl = el('div', { className: 'n' });
      if (isHtml) nEl.innerHTML = n; else nEl.textContent = n;
      statGrid.appendChild(el('div', { className: 'stat' }, [nEl, el('div', { className: 'l', textContent: l })]));
    });
    detailPanel.appendChild(statGrid);

    if (run.error) {
      detailPanel.appendChild(el('p', { className: 'err-text', textContent: 'Erro: ' + run.error }));
    }

    detailPanel.appendChild(el('h2', { textContent: cfg.breakdownTitle }));
    if (breakdownRows.length) {
      detailPanel.appendChild(renderBreakdownChart(breakdownRows));

      const table = el('table');
      const thead = el('thead', {}, [el('tr', {}, [cfg.groupLabel, ...cfg.series.map(s => s.label), 'Total'].map(h => el('th', { textContent: h })))]);
      const tbody = el('tbody', {}, breakdownRows.map(r => el('tr', {}, [
        el('td', { textContent: r.label }),
        ...cfg.series.map(s => el('td', { textContent: String(r.counts[s.key] || 0) })),
        el('td', { textContent: String(r.total) }),
      ])));
      table.appendChild(thead);
      table.appendChild(tbody);
      detailPanel.appendChild(table);
    } else {
      detailPanel.appendChild(el('p', { className: 'muted', textContent: 'Nenhuma supressao registrada.' }));
    }

    detailPanel.appendChild(el('h2', { textContent: 'Envio por conta Snov.io' }));
    if (run.account_results.length) {
      const table = el('table');
      const thead = el('thead', {}, [el('tr', {}, ['Conta', 'List ID', 'Enviados', 'Duplicados', 'Falharam', 'Erro'].map(h => el('th', { textContent: h })))]);
      const tbody = el('tbody', {}, run.account_results.map(a => el('tr', {}, [
        el('td', { textContent: a.account_label }),
        el('td', { textContent: a.list_id ?? '-' }),
        el('td', { textContent: String(a.added) }),
        el('td', { textContent: String(a.duplicates) }),
        el('td', { textContent: String(a.failed) }),
        el('td', { className: 'err-text', textContent: a.error ?? '' }),
      ])));
      table.appendChild(thead);
      table.appendChild(tbody);
      detailPanel.appendChild(table);
    } else {
      detailPanel.appendChild(el('p', { className: 'muted', textContent: 'Nenhum envio (dry-run ou sem contas).' }));
    }
  }

  loadRuns();
  setInterval(loadRuns, 10000);
  setInterval(() => { if (selectedRunId !== null) loadDetail(selectedRunId); }, 10000);
}

// ---- Mailgun: breakdown por dominio, 3 series (bounces/complaints/unsubscribes) ----
createDashboard({
  prefix: 'mailgun',
  apiBase: '/api/runs',
  triggerUrl: '/api/runs/trigger',
  confirmMessage: () => 'Rodar a negativacao Mailgun agora? Isso busca as supressoes atuais (bounces/complaints/unsubscribes) de todos os dominios e envia de verdade pra Lista de e-mails a nao enviar de TODAS as contas Snov.io ativas.',
  groupLabel: 'Dominio',
  breakdownTitle: 'Supressoes por dominio (Mailgun)',
  series: [
    { key: 'bounces', color: 'var(--series-1)', label: 'Bounces' },
    { key: 'complaints', color: 'var(--series-2)', label: 'Complaints' },
    { key: 'unsubscribes', color: 'var(--series-3)', label: 'Unsubscribes' },
  ],
  runSummaryLine: (r) => `${r.domains_count ?? '-'} dominios · ${r.total_emails ?? '-'} e-mails`,
  extraStats: (run) => [[run.domains_count ?? '-', 'dominios Mailgun']],
  buildBreakdownRows: (run) => {
    const totals = {};
    (run.domain_suppressions || []).forEach(d => {
      totals[d.domain] = totals[d.domain] || {};
      totals[d.domain][d.kind] = d.count;
    });
    return Object.entries(totals)
      .map(([domain, counts]) => ({
        label: domain,
        counts,
        total: (counts.bounces || 0) + (counts.complaints || 0) + (counts.unsubscribes || 0),
      }))
      .filter(r => r.total > 0)
      .sort((a, b) => b.total - a.total);
  },
});

// ---- SendGrid: breakdown por data, 1 serie (inativos - sem conceito de dominio) ----
createDashboard({
  prefix: 'sendgrid',
  apiBase: '/api/sendgrid/runs',
  triggerUrl: '/api/sendgrid/runs/trigger',
  triggerBody: (todos) => ({ todos }),
  confirmMessage: (todos) => todos
    ? 'Rodar a negativacao SendGrid agora com --todos (TODO o historico de contatos inativos)? Envio real pra TODAS as contas Snov.io ativas.'
    : 'Rodar a negativacao SendGrid agora (so o dia anterior)? Envio real pra TODAS as contas Snov.io ativas.',
  groupLabel: 'Data',
  breakdownTitle: 'Negativados por data (SendGrid)',
  series: [
    { key: 'count', color: 'var(--series-1)', label: 'Inativos' },
  ],
  runSummaryLine: (r) => `${r.mode ?? '-'} · ${r.total_emails ?? '-'} e-mails`,
  extraStats: (run) => [
    [run.mode ?? '-', 'modo'],
    [`${run.desde ?? '-'} → ${run.ate ?? '-'}`, 'periodo'],
  ],
  buildBreakdownRows: (run) => {
    return (run.date_breakdown || [])
      .map(d => ({ label: d.date, counts: { count: d.count }, total: d.count }))
      .sort((a, b) => a.label.localeCompare(b.label));
  },
});
</script>
</body>
</html>
