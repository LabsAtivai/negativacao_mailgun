x-env: &env
  MAILGUN_API_KEY: ${MAILGUN_API_KEY}
  MAILGUN_BASE_URL: ${MAILGUN_BASE_URL:-}
  CREDENTIALS_API_URL: ${CREDENTIALS_API_URL}
  CREDENTIALS_API_KEY: ${CREDENTIALS_API_KEY}
  SNOVIO_BATCH_SIZE: ${SNOVIO_BATCH_SIZE:-100}
  SNOVIO_RATE_LIMIT_PER_MIN: ${SNOVIO_RATE_LIMIT_PER_MIN:-60}
  PIPELINE_WORKERS: ${PIPELINE_WORKERS:-5}
  DB_PATH: ${DB_PATH:-/app/data/negativacao.db}
  # So usada se algum caller externo ainda entregar runs via
  # POST /api/sendgrid/ingest (o negativacao_sendgrid.py deste stack grava
  # direto no SQLite, nao precisa disso).
  SENDGRID_INGEST_API_KEY: ${SENDGRID_INGEST_API_KEY:-}
  # Chave exigida em POST /api/postal/webhook?key=... (configurada no admin
  # do Postal, na URL do webhook do servidor).
  POSTAL_WEBHOOK_SECRET: ${POSTAL_WEBHOOK_SECRET:-}
  # Agendamento diario dos 3 pipelines, rodando dentro do servico "dashboard".
  SCHEDULE_TIMEZONE: ${SCHEDULE_TIMEZONE:-America/Sao_Paulo}
  SCHEDULE_HOUR: ${SCHEDULE_HOUR:-1}
  SCHEDULE_MINUTE: ${SCHEDULE_MINUTE:-0}

x-sendgrid-mysql-env: &sendgrid-mysql-env
  DB_HOST: ${SENDGRID_DB_HOST}
  DB_PORT: ${SENDGRID_DB_PORT:-3306}
  DB_USER: ${SENDGRID_DB_USER}
  DB_PASSWORD: ${SENDGRID_DB_PASSWORD}
  DB_NAME: ${SENDGRID_DB_NAME}
  DB_TABLE: ${SENDGRID_DB_TABLE}
  DB_EMAIL_COLUMN: ${SENDGRID_DB_EMAIL_COLUMN:-email}
  DB_ATIVO_COLUMN: ${SENDGRID_DB_ATIVO_COLUMN:-ativo}
  DB_DATE_COLUMN: ${SENDGRID_DB_DATE_COLUMN:-data_alteracao}
  DB_MOTIVO_COLUMN: ${SENDGRID_DB_MOTIVO_COLUMN:-motivo_negativacao}

services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      <<: [*env, *sendgrid-mysql-env]
    volumes:
      - negativacao_data:/app/data
    networks:
      - ativaai

  # Um-shot: roda a negativacao e sai. Nao fica em pe sozinho.
  # Dispare manualmente (no host, dentro da pasta do stack):
  #   docker compose --profile manual run --rm negativacao
  # ) ou agende via cron do host chamando o mesmo comando.
  negativacao:
    build: .
    command: ["python", "negativacao_mailgun.py"]
    environment:
      <<: *env
    volumes:
      - negativacao_data:/app/data
    networks:
      - ativaai
    profiles:
      - manual

  # Um-shot: mesma ideia do "negativacao" acima, so que pro pipeline
  # SendGrid (contatos ativo=0 num MySQL). Dispare manualmente:
  #   docker compose --profile manual run --rm negativacao_sendgrid [-- --todos]
  # ou agende via cron do host chamando o mesmo comando.
  negativacao_sendgrid:
    build: .
    command: ["python", "negativacao_sendgrid.py"]
    environment:
      <<: [*env, *sendgrid-mysql-env]
    volumes:
      - negativacao_data:/app/data
    networks:
      - ativaai
    profiles:
      - manual

  # Um-shot: mesma ideia dos dois acima, so que pro pipeline Postal. Nao ha
  # nada pra "puxar" de fora - so consome os eventos de webhook ja recebidos
  # pelo servico "dashboard" (POST /api/postal/webhook) e gravados no SQLite
  # compartilhado. Dispare manualmente:
  #   docker compose --profile manual run --rm negativacao_postal [-- --todos]
  # ou agende via cron do host (roda so os eventos novos por padrao).
  negativacao_postal:
    build: .
    command: ["python", "negativacao_postal.py"]
    environment:
      <<: *env
    volumes:
      - negativacao_data:/app/data
    networks:
      - ativaai
    profiles:
      - manual

volumes:
  negativacao_data:

networks:
  ativaai:
    external: true
