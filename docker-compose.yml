services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - negativacao_data:/app/data
    networks:
      - ativaai

  # Um-shot: roda a negativacao e sai. Nao fica em pe sozinho.
  # Dispare manualmente (Portainer: "Run" nesse servico, ou no host:
  #   docker compose run --rm negativacao
  # ) ou agende via cron do host / job do Portainer chamando o mesmo comando.
  negativacao:
    build: .
    command: ["python", "negativacao_mailgun.py"]
    env_file: .env
    volumes:
      - negativacao_data:/app/data
    networks:
      - ativaai
    profiles:
      - manual

volumes:
  negativacao_data:

networks:
  ativaai:
    external: true
